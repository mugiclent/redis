# redis.conf — edit here, commit, push. GitHub Actions will restart the container.

# ─── NETWORK ──────────────────────────────────────────────────────────────────
bind 0.0.0.0
port 6379
protected-mode yes

# ─── AUTH ─────────────────────────────────────────────────────────────────────
# Password is injected at runtime — do not hardcode here.
# The deploy pipeline writes it via: redis-cli CONFIG SET requirepass <secret>
# This placeholder ensures protected-mode stays enforced until that runs.
requirepass REDIS_PASSWORD_PLACEHOLDER

# ─── MEMORY ───────────────────────────────────────────────────────────────────
# Maximum RAM Redis may use before evicting keys.
# Set this below total server RAM to leave headroom for the OS and other services.
maxmemory 3gb

# Eviction policy when maxmemory is reached:
#   allkeys-lru   — evict any key, least recently used first (good for pure caching)
#   volatile-lru  — evict only keys with a TTL set (safe for mixed session + persistent store)
#
# volatile-lru is required here because some keys must never be evicted under pressure:
#   org_blocked:{org_id}      — no TTL; evicting would silently re-allow a blocked org
# Keys with TTLs (topup_owner:*, rate-limit counters) are fair game and evicted first.
# Refresh tokens and sessions live in Postgres, not Redis — not a concern here.
maxmemory-policy volatile-lru

# ─── PERSISTENCE ──────────────────────────────────────────────────────────────
# RDB snapshots — lightweight periodic saves
save 900 1
save 300 10
save 60 10000
dbfilename dump.rdb

# AOF — append-only log, survives crashes with at most 1s of data loss
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Both RDB and AOF are on. Redis uses AOF on restart (more durable),
# RDB for faster cold-start when AOF is not available.

# ─── LOGGING ──────────────────────────────────────────────────────────────────
loglevel notice

# ─── GENERAL ──────────────────────────────────────────────────────────────────
databases 16
hz 10
